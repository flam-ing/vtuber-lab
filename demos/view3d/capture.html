<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>slot capture</title>
<style>
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#0a0a0c; }
  canvas { display:block; width:100%; height:100%; }
  #status {
    position:fixed; left:12px; top:12px; z-index:2; color:#9aa3b2;
    font:12px/1.3 system-ui,sans-serif; opacity:.85; pointer-events:none;
    display:none; /* hidden for clean README GIFs; ?debug=1 to show */
  }
</style>
</head>
<body>
<div id="status">loading…</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

const params = new URLSearchParams(location.search);
const kind = (params.get('m') || 'obj').toLowerCase();
const SIZE = Math.min(720, Math.max(480, Number(params.get('size') || 560)));
const status = document.getElementById('status');
if (params.get('debug') === '1') status.style.display = 'block';

// fixed pixel size for consistent capture
document.documentElement.style.width = SIZE + 'px';
document.documentElement.style.height = SIZE + 'px';
document.body.style.width = SIZE + 'px';
document.body.style.height = SIZE + 'px';

const ROOT = '../..';
const PATHS = {
  obj: `${ROOT}/03-flamingo-3d-obj/models/flamingo_3d.obj`,
  fbx: `${ROOT}/04-meshy-flamingo-fbx/models/meshy_flamingo.fbx`,
  fbxTex: `${ROOT}/04-meshy-flamingo-fbx/models/meshy_flamingo.png`,
  vrm: `${ROOT}/05-flamingo-motion-vrm/models/flamingo_motion.vrm`,
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.setClearColor(0x0a0a0c, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 1000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 1.15));
const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(2.2, 4, 3);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
fill.position.set(-2, 1.2, -1.5);
scene.add(fill);

let root = null;
let vrm = null;
let t0 = performance.now();
window.__captureReady = false;
window.__captureKind = kind;

function fit(object, offset = 1.4) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const max = Math.max(size.x, size.y, size.z) || 1;
  object.position.sub(center);
  // slight lift for characters
  if (kind === 'vrm') object.position.y += size.y * 0.02;
  camera.position.set(max * 0.85, max * 0.45, max * offset);
  camera.near = max / 200;
  camera.far = max * 50;
  camera.lookAt(0, kind === 'vrm' ? max * 0.08 : 0, 0);
  camera.updateProjectionMatrix();
}

function setObject(obj, fitOff) {
  if (root) scene.remove(root);
  root = obj;
  scene.add(obj);
  fit(obj, fitOff);
}

function markReady() {
  // render a couple frames then flag
  for (let i = 0; i < 3; i++) {
    if (root) root.rotation.y = 0.15 * i;
    if (vrm) vrm.update(1 / 30);
    renderer.render(scene, camera);
  }
  if (root) root.rotation.y = 0;
  renderer.render(scene, camera);
  window.__captureReady = true;
  status.textContent = `ready · ${kind}`;
}

function tick() {
  requestAnimationFrame(tick);
  const t = (performance.now() - t0) / 1000;
  if (root) {
    // full turn ~4.5s
    root.rotation.y = t * (Math.PI * 2 / 4.5);
    if (kind === 'vrm') {
      // gentle head/idle
      const head = root.getObjectByName('J_Bip_C_Head') || root.getObjectByName('Head');
      if (head) {
        head.rotation.x = Math.sin(t * 1.4) * 0.08;
        head.rotation.z = Math.sin(t * 0.9) * 0.05;
      }
    }
  }
  if (vrm) vrm.update(1 / 60);
  renderer.render(scene, camera);
}
tick();

async function load() {
  status.textContent = `loading ${kind}…`;
  try {
    if (kind === 'obj') {
      const obj = await new OBJLoader().loadAsync(PATHS.obj);
      obj.traverse((o) => {
        if (o.isMesh) {
          o.material = new THREE.MeshStandardMaterial({
            color: 0xff6b9d,
            roughness: 0.55,
            metalness: 0.05,
          });
        }
      });
      setObject(obj, 1.55);
      markReady();
      return;
    }
    if (kind === 'fbx') {
      const fbx = await new FBXLoader().loadAsync(PATHS.fbx);
      const tex = await new THREE.TextureLoader().loadAsync(PATHS.fbxTex);
      tex.colorSpace = THREE.SRGBColorSpace;
      fbx.traverse((o) => {
        if (o.isMesh) {
          const mats = Array.isArray(o.material) ? o.material : [o.material];
          mats.forEach((m) => {
            if (m && m.map == null) m.map = tex;
            if (m) m.needsUpdate = true;
          });
        }
      });
      const box = new THREE.Box3().setFromObject(fbx);
      const size = box.getSize(new THREE.Vector3());
      const max = Math.max(size.x, size.y, size.z) || 1;
      if (max > 20) fbx.scale.setScalar(2 / max);
      setObject(fbx, 1.65);
      markReady();
      return;
    }
    if (kind === 'vrm') {
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMLoaderPlugin(parser));
      const gltf = await loader.loadAsync(PATHS.vrm);
      vrm = gltf.userData.vrm;
      if (vrm) {
        try { VRMUtils.rotateVRM0(vrm); } catch (_) {}
        vrm.scene.traverse((o) => { o.frustumCulled = false; });
        setObject(vrm.scene, 1.2);
      } else {
        setObject(gltf.scene, 1.2);
      }
      markReady();
      return;
    }
    status.textContent = 'unknown m=';
  } catch (e) {
    console.error(e);
    status.textContent = 'load error: ' + (e && e.message ? e.message : e);
  }
}

load();
</script>
</body>
</html>
